plugins {
    id 'com.android.application'
}

android {
    namespace 'com.syu.voice.hook'
    compileSdk 33

    defaultConfig {
        applicationId "com.syu.voice.hook"
        minSdk 21
        targetSdk 33
        // 版本号规则：1.1.0 -> 10100（主*10000 + 次*100 + 补丁），与 GitHub Release tag vX.Y.Z 对应
        versionCode 10302
        versionName "1.3.2"
    }

    // 显式配置固定 debug keystore，确保 CI 与本地签名一致（避免覆盖安装时报签名不一致）
    // keystore 由 CI 从 GitHub Secret DEBUG_KEYSTORE_BASE64 解码到 ~/.android/debug.keystore
    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        // AGP 8 默认关闭 BuildConfig，模块代码用到了 VERSION_NAME/VERSION_CODE
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Xposed API：仅编译期引用，不会打包进 APK
    compileOnly 'de.robv.android.xposed:api:82'
}
